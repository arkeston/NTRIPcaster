# NTRIP Caster Alarm rules
# Define alarm conditions for various monitoring metrics

groups:
  # NTRIP Caster App Alarm
  - name: ntrip-caster.rules
    rules:
      # Service Availability Alert
      - alert: NTRIPCasterDown
        expr: up{job="ntrip-caster"} == 0
        for: 1m
        labels:
          severity: critical
          service: ntrip-caster
        annotations:
          summary: "NTRIP CasterService not available"
          description: "NTRIP CasterThe service has stopped responding to more than1min"
      
      # High Error Rate Alarm
      - alert: NTRIPCasterHighErrorRate
        expr: rate(ntrip_requests_total{status=~"5.."}[5m]) / rate(ntrip_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: ntrip-caster
        annotations:
          summary: "NTRIP CasterToo high error rate"
          description: "NTRIP Casterin the past5Error rate exceeds in minutes10%"
      
      # Response time alarm
      - alert: NTRIPCasterHighLatency
        expr: histogram_quantile(0.95, rate(ntrip_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: ntrip-caster
        annotations:
          summary: "NTRIP CasterResponse time is too long"
          description: "NTRIP Caster 95%Quartile response time exceeded2s"
      
      # Connection number alarm
      - alert: NTRIPCasterHighConnections
        expr: ntrip_active_connections > 1000
        for: 5m
        labels:
          severity: warning
          service: ntrip-caster
        annotations:
          summary: "NTRIP CasterToo many connections"
          description: "NTRIP CasterThe number of active connections currently exceeds1000"
      
      # Memory usage alarm
      - alert: NTRIPCasterHighMemoryUsage
        expr: process_resident_memory_bytes{job="ntrip-caster"} / 1024 / 1024 > 512
        for: 10m
        labels:
          severity: warning
          service: ntrip-caster
        annotations:
          summary: "NTRIP CasterHigh memory usage"
          description: "NTRIP CasterMore than512MB"

  # System Resource Alarm
  - name: system.rules
    rules:
      # CPUUsage Alarm
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "CPUHigh usage"
          description: "Examples {{ $labels.instance }} CPUMore than80%"
      
      # Memory usage alarm
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Examples {{ $labels.instance }} Memory usage exceeds85%"
      
      # Disk Space Alarm
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Out of disk space"
          description: "Examples {{ $labels.instance }} Disk {{ $labels.mountpoint }} More than85%"
      
      # DiskIOAlarm
      - alert: HighDiskIO
        expr: rate(node_disk_io_time_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "DiskIOHigh usage"
          description: "Examples {{ $labels.instance }} DiskIOMore than80%"

  # Container Alarm
  - name: container.rules
    rules:
      # Container restart alarm
      - alert: ContainerRestarted
        expr: increase(container_start_time_seconds[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "Container restart"
          description: "Container {{ $labels.name }} in the past1Restarted in hours"
      
      # ContainerCPUUsage Alarm
      - alert: ContainerHighCPUUsage
        expr: (rate(container_cpu_usage_seconds_total[5m]) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "ContainerCPUHigh usage"
          description: "Container {{ $labels.name }} CPUMore than80%"
      
      # Container Memory Usage Alarm
      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "Container memory usage is too high"
          description: "Container {{ $labels.name }} Memory usage exceeds85%"

  # NginxAlarm
  - name: nginx.rules
    rules:
      # NginxService Alarm
      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: "NginxService not available"
          description: "NginxThe service has stopped responding to more than1min"
      
      # NginxHigh Error Rate Alarm
      - alert: NginxHighErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: nginx
        annotations:
          summary: "NginxToo high error rate"
          description: "Nginxin the past5within minutes of5xxError rate exceeds10%"

  # RedisAlarm
  - name: redis.rules
    rules:
      # RedisService Alarm
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "RedisService not available"
          description: "RedisThe service has stopped responding to more than1min"
      
      # RedisMemory usage alarm
      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "RedisHigh memory usage"
          description: "RedisMemory usage exceeds85%"
      
      # RedisConnection number alarm
      - alert: RedisHighConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "RedisToo many connections"
          description: "RedisThe current number of connections exceeds100"

  # Network Alarm
  - name: network.rules
    rules:
      # Network delay alarm
      - alert: HighNetworkLatency
        expr: probe_duration_seconds > 1
        for: 5m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "High network latency"
          description: "Objectives {{ $labels.instance }} Network latency exceeds1s"
      
      # Network connection failure alarm
      - alert: NetworkProbeFailure
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
          component: network
        annotations:
          summary: "Network Probe Failure"
          description: "Objectives {{ $labels.instance }} Network probe failure exceeds2min"