# Grafana Dashboard configuration
# Automatically load dashboard files

apiVersion: 1

providers:
  # NTRIP Caster Dashboard
  - name: 'ntrip-dashboards'
    orgId: 1
    folder: 'NTRIP Caster'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/ntrip
  
  # System Monitoring Dashboard
  - name: 'system-dashboards'
    orgId: 1
    folder: 'System Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/system
  
  # Container Monitoring Dashboard
  - name: 'container-dashboards'
    orgId: 1
    folder: 'Container Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/containers
  
  # Network Monitoring Dashboard
  - name: 'network-dashboards'
    orgId: 1
    folder: 'Network Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/network
  
  # App Monitoring Dashboard
  - name: 'application-dashboards'
    orgId: 1
    folder: 'Application Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/applications